<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<div id="turnosAE" class="turnos-root">
  <style>
    #turnosAE{--ink:#0a0a0a;--paper:#fff;--line:#cfcfcf;--soft:#f1f1f1;--muted:#666;--danger:#8e1f1f;--ok:#1f6b3f;font-family:Arial,Helvetica,sans-serif;background:#e9e9e9;color:#111;min-height:100vh;box-sizing:border-box}
    #turnosAE *{box-sizing:border-box}
    #turnosAE button,#turnosAE input,#turnosAE select,#turnosAE textarea{font:inherit}
    #turnosAE .stage{min-height:100vh;padding:24px 12px;display:flex;justify-content:center;align-items:flex-start;background:#e9e9e9}
    #turnosAE .phone{width:min(100%,410px);min-height:760px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;position:relative}
    #turnosAE .head{padding:15px 22px;border-bottom:1px solid #d8d8d8;display:flex;align-items:center;gap:11px;background:#fff}
    #turnosAE .head.hidden{display:none}
    #turnosAE .avatar{width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;border:1px solid #111;flex:0 0 44px}
    #turnosAE .avatar img{width:100%;height:100%;object-fit:cover}
    #turnosAE .who{min-width:0}.who strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{display:block;font-size:10px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #turnosAE .screen{flex:1;padding:34px 34px 26px;background:#fff}
    #turnosAE .foot{padding:12px 10px;background:#f0f0f0;border-top:1px solid #dedede;text-align:center;font-size:10px;font-weight:700;letter-spacing:.01em}
    #turnosAE h1,#turnosAE h2{margin:0;color:#111;text-align:center;text-transform:uppercase;font-weight:500;line-height:1.12}
    #turnosAE h1{font-size:26px}#turnosAE h2{font-size:22px;margin-bottom:20px}
    #turnosAE h3{font-size:15px;margin:16px 0 8px}
    #turnosAE p{font-size:13px;line-height:1.4;margin:7px 0}
    #turnosAE .center{text-align:center}#turnosAE .muted{font-size:11px;color:#555;line-height:1.35}.spacer-xl{height:62px}.spacer-lg{height:36px}.spacer-md{height:18px}
    #turnosAE .btn{border:0;background:linear-gradient(#3b3b3b 0%,#111 45%,#000 100%);color:#fff;border-radius:5px;min-height:38px;padding:8px 18px;min-width:142px;cursor:pointer;box-shadow:0 4px 7px rgba(0,0,0,.42);font-size:16px;letter-spacing:.03em}
    #turnosAE .btn:disabled{opacity:.45;cursor:not-allowed}.btn.small{min-width:0;min-height:30px;padding:5px 9px;font-size:12px}.btn.danger{background:linear-gradient(#a43b3b,#691414)}
    #turnosAE .buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}.buttons.stack{flex-direction:column;align-items:center}.buttons.stack .btn{width:190px}
    #turnosAE .form{display:grid;gap:11px}#turnosAE label{display:grid;gap:3px;font-size:14px;font-weight:700;color:#111}
    #turnosAE input,#turnosAE select,#turnosAE textarea{width:100%;border:1px solid #111;background:#fff;color:#111;border-radius:0;min-height:34px;padding:7px 9px}
    #turnosAE input[type=checkbox],#turnosAE input[type=radio]{width:auto;min-height:auto}
    #turnosAE textarea{min-height:92px;resize:vertical}
    #turnosAE .check{display:flex;align-items:flex-start;gap:8px;font-size:12px;font-weight:400;line-height:1.3}.check input{margin-top:2px}
    #turnosAE .choice{border:1px solid #111;padding:13px 12px;display:grid;gap:8px;margin-bottom:10px}.choice label{display:flex;align-items:flex-start;gap:8px;font-weight:400;font-size:12px}.choice strong{font-size:13px}
    #turnosAE .menu{margin-top:8px}.menu button{width:100%;background:#fff;border:0;border-bottom:1px solid #ddd;text-align:left;padding:13px 2px;cursor:pointer;color:#111}.menu button strong{display:block;font-size:15px}.menu button small{display:block;font-size:10px;color:#666;margin-top:2px}
    #turnosAE .note{border:1px solid #bcbcbc;background:#f7f7f7;padding:10px 11px;font-size:11px;line-height:1.35;margin:12px 0}
    #turnosAE .error{border:1px solid #a44;background:#fff6f6;color:#711;padding:9px 10px;font-size:11px;margin:10px 0}.okbox{border:1px solid #628b70;background:#f4fbf6;color:#214b31;padding:9px 10px;font-size:11px;margin:10px 0}
    #turnosAE .table-wrap{overflow:auto;border:1px solid #222;margin-top:10px}#turnosAE table{border-collapse:collapse;width:100%;min-width:590px;font-size:10px}#turnosAE th,#turnosAE td{border-bottom:1px solid #ccc;border-right:1px solid #ddd;padding:6px 5px;text-align:left;white-space:nowrap}#turnosAE th{background:#e9e9e9;font-size:9px}#turnosAE td:last-child,#turnosAE th:last-child{border-right:0}
    #turnosAE .status{font-size:9px;font-weight:700}.status.programada{color:#175f38}.status.cancelada{color:#8e1f1f}.status.atendida{color:#444}
    #turnosAE .summary{border:1px solid #999;padding:14px;background:#fff}.summary dl{display:grid;grid-template-columns:135px 1fr;gap:6px;font-size:11px;margin:0}.summary dt{font-weight:700}.summary dd{margin:0}
    #turnosAE .notification{padding:10px 0;border-bottom:1px solid #ddd}.notification:last-child{border-bottom:0}.notification strong{display:block;font-size:12px}.notification p{font-size:11px;color:#444;margin:3px 0}.notification time{font-size:9px;color:#777}
    #turnosAE .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.slot{border:1px solid #111;background:#fff;padding:8px 4px;font-size:11px;cursor:pointer}.slot.selected{background:#111;color:#fff}.slot:disabled{opacity:.35;cursor:not-allowed}
    #turnosAE .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.stat{border:1px solid #bbb;padding:9px}.stat span{display:block;font-size:9px;color:#666}.stat strong{display:block;font-size:20px;margin-top:2px}
    #turnosAE .bars{display:grid;gap:8px}.barrow{display:grid;grid-template-columns:105px 1fr 32px;gap:6px;align-items:center;font-size:9px}.bar{height:9px;background:#e7e7e7}.bar i{display:block;height:100%;background:#222}.barrow b{text-align:right}
    #turnosAE .photo-control{display:grid;justify-items:center;gap:8px;margin-bottom:18px}.photo-control .avatar{width:70px;height:70px}.photo-control input{font-size:11px;border:0;padding:0}
    #turnosAE .code{display:grid;grid-template-columns:repeat(4,48px);justify-content:center;gap:8px;margin:18px 0}.code input{text-align:center;font-size:24px;height:52px}
    #turnosAE .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#111;color:#fff;padding:10px 13px;font-size:11px;box-shadow:0 5px 20px rgba(0,0,0,.3);z-index:50;max-width:340px}.hidden{display:none!important}
    #turnosAE .splash{min-height:620px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}.splash h1{font-size:27px}.loader{width:28px;height:28px;border:3px solid #ddd;border-top-color:#111;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    #turnosAE .tiny{font-size:9px;color:#777}.section-title{font-size:12px;font-weight:700;text-transform:uppercase;margin:16px 0 6px}.inline{display:flex;gap:8px;align-items:center}.grow{flex:1}
    @media(max-width:520px){#turnosAE .stage{padding:0}#turnosAE .phone{width:100%;min-height:100vh;box-shadow:none}#turnosAE .screen{padding:30px 24px 24px}#turnosAE .summary dl{grid-template-columns:1fr;gap:2px}#turnosAE .summary dd{margin-bottom:5px}}
  </style>
  <main class="stage">
    <section class="phone" aria-label="Sistema de Turnos para Almacenes">
      <header class="head hidden" id="appHead"><div class="avatar" id="avatar">PP</div><div class="who"><strong id="userName">Usuario</strong><small id="userMail">correo</small></div></header>
      <div class="screen" id="screen"></div>
      <footer class="foot">SISTEMA DE TURNOS PARA ALMACENES</footer>
    </section>
    <div class="toast hidden" id="toast" aria-live="polite"></div>
  </main>
  <script>
  (()=>{
    const root=document.getElementById('turnosAE'); if(root.dataset.ready==='1') return; root.dataset.ready='1';
    const $=s=>root.querySelector(s), screen=$('#screen'), head=$('#appHead');
    const KEY='turnosAE_prototipo_v4';
    const allowedVisitorDomains=['fiscalia.gov.co','correo.policia.gov.co','medicinalegal.gov.co'];
    const allowedAdminDomain='fiscalia.gov.co';
    const warehouses=['Bogotá','Medellín','Cali','Pereira','Manizales','Soacha'];
    const cities=['Bogotá','Medellín','Cali','Pereira','Manizales','Soacha','Villavicencio','Barranquilla','Bucaramanga','Cartagena'];
    const durationByQty={'1-5':30,'6-10':60,'11-15':90,'16-20':120,'Más de 20':150};
    const defaultUsers=[
      {id:'v-demo',role:'visitor',name:'Pedro Perez',docType:'C.C.',doc:'1111111111',email:'pedro.perez@correo.policia.gov.co',phone:'3150000000',entity:'Policía Nacional',job:'Policía Judicial PONAL',city:'Bogotá',password:'Pedroperez64*',active:true,photo:''},
      {id:'a-demo',role:'admin',name:'Florindo Florez',docType:'C.C.',doc:'2222222222',email:'florindo.florez@fiscalia.gov.co',phone:'3152222222',entity:'Fiscalía General de la Nación',job:'Administrador Almacén',city:'Bogotá',warehouse:'Bogotá',password:'Florinflo98*',active:true,photo:''}
    ];
    const seed={users:defaultUsers,adminAuthorizations:[
      {doc:'2222222222',name:'Florindo Florez',email:'florindo.florez@fiscalia.gov.co',warehouse:'Bogotá',status:'ACTIVO',updatedAt:'2026-08-24',authorizedBy:'Registro inicial'}
    ],appointments:[
      {id:'ap1',userId:'v-demo',warehouse:'Bogotá',motive:'Entrega',qty:'1-5',date:'2026-08-24',start:'09:00',end:'09:30',status:'Programada',createdAt:'2026-08-20T09:00:00'},
      {id:'ap2',userId:'v-demo',warehouse:'Bogotá',motive:'Salida',qty:'6-10',date:'2026-08-27',start:'10:00',end:'11:00',status:'Programada',createdAt:'2026-08-20T09:05:00'},
      {id:'ap3',userId:'v-demo',warehouse:'Bogotá',motive:'Devolución',qty:'1-5',date:'2026-08-18',start:'14:00',end:'14:30',status:'Atendida',createdAt:'2026-08-10T10:00:00'}
    ],closures:[],notifications:[
      {id:'n1',recipient:'v-demo',title:'Agendamiento de cita',text:'Recuerde que tiene una cita el 24/08/2026 a las 09:00 en el almacén Bogotá.',date:'2026-08-20'},
      {id:'n2',recipient:'a-demo',title:'Agendamiento de cita',text:'Se agendó una cita para el 24/08/2026 a las 09:00 en el almacén Bogotá.',date:'2026-08-20'}
    ],support:[],pqrsf:[],messages:[]};
    let db=load();
    let state={screen:'splash',session:null,registerRole:'visitor',registerDraft:{},selectedSlot:null,adminCode:'1111',adminAttempts:0,lastAppointment:null,statsFilter:null,userFilter:null,policyViewed:false,policyAccepted:false};
    function cloneSeed(){return JSON.parse(JSON.stringify(seed))}
    function load(){try{const raw=window.localStorage?localStorage.getItem(KEY):null;return raw?JSON.parse(raw):cloneSeed()}catch(e){return cloneSeed()}}
    function save(){try{if(window.localStorage)localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('No fue posible guardar datos localmente.',e)}}
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
    function fmtDate(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
    function nowISODate(){return new Date().toISOString().slice(0,10)}
    function addMin(time,mins){const [h,m]=time.split(':').map(Number);const d=new Date(2000,0,1,h,m+mins);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
    function minutes(time){const [h,m]=time.split(':').map(Number);return h*60+m}
    function rangesOverlap(s1,e1,s2,e2){return Math.max(minutes(s1),minutes(s2))<Math.min(minutes(e1),minutes(e2))}
    function currentUser(){return db.users.find(u=>u.id===state.session)||null}
    function setHeader(){const u=currentUser();head.classList.toggle('hidden',!u);if(!u)return;$('#userName').textContent=u.name;$('#userMail').textContent=u.email;const av=$('#avatar');av.innerHTML=u.photo?`<img src="${u.photo}" alt="Foto de perfil">`:esc(u.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}
    function go(name){state.screen=name;render()}
    function render(){setHeader();const fn=views[state.screen]||views.home;screen.innerHTML=fn();bind()}
    function usersForCity(city){return db.users.filter(u=>u.role==='visitor'&&u.city===city)}
    function notify(recipient,title,text){db.notifications.unshift({id:'n'+Date.now()+Math.random(),recipient,title,text,date:nowISODate()});save()}
    function getUserAppointments(userId){return db.appointments.filter(a=>a.userId===userId).sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start))}
    function getAdminAppointments(u){return db.appointments.filter(a=>a.warehouse===u.warehouse)}
    function eligibleCancel(a){if(a.status!=='Programada')return false;const start=new Date(`${a.date}T${a.start}:00`);return (start-Date.now())>=3600000}
    function slotOptions(warehouse,date,qty){if(!date)return[];const duration=durationByQty[qty]||30;const base=[];for(let m=8*60;m<=11*60+30;m+=30)base.push(m);for(let m=14*60;m<=16*60+30;m+=30)base.push(m);const busy=db.appointments.filter(a=>a.warehouse===warehouse&&a.date===date&&a.status==='Programada');const closed=db.closures.filter(c=>c.warehouse===warehouse&&date>=c.from&&date<=c.to);return base.map(m=>{const start=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`,end=addMin(start,duration);const out=minutes(end)>17*60;const lunch=minutes(start)<12*60&&minutes(end)>12*60;const isBusy=busy.some(a=>rangesOverlap(start,end,a.start,a.end));const isClosed=closed.some(c=>rangesOverlap(start,end,c.start,c.end));return {start,end,available:!out&&!lunch&&!isBusy&&!isClosed}}).filter(x=>x.available)}
    function calendarNotice(warehouse,date){const c=db.closures.find(c=>c.warehouse===warehouse&&date>=c.from&&date<=c.to);return c?.message||''}
    function tableAppointments(arr,withCancel=false){return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Almacén</th><th>Motivo</th><th>Cantidad</th><th>Inicio</th><th>Final</th><th>Estado</th>${withCancel?'<th></th>':''}</tr></thead><tbody>${arr.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.warehouse)}</td><td>${esc(a.motive)}</td><td>${esc(a.qty)}</td><td>${esc(a.start)}</td><td>${esc(a.end)}</td><td><span class="status ${a.status.toLowerCase()}">${esc(a.status)}</span></td>${withCancel?`<td><button class="btn small danger" data-cancel="${a.id}" ${eligibleCancel(a)?'':'disabled'}>Cancelar</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${withCancel?8:7}">No hay registros.</td></tr>`}</tbody></table></div>`}
    function summaryAppointment(a,title){const u=db.users.find(x=>x.id===a.userId)||{};return `<h2>${title}</h2><div class="summary"><dl><dt>Nombre completo</dt><dd>${esc(u.name)}</dd><dt>Entidad</dt><dd>${esc(u.entity)}</dd><dt>Almacén</dt><dd>${esc(a.warehouse)}</dd><dt>Motivo visita</dt><dd>${esc(a.motive)}</dd><dt>Cantidad de elementos de prueba</dt><dd>${esc(a.qty)}</dd><dt>Fecha</dt><dd>${fmtDate(a.date)}</dd><dt>Hora</dt><dd>${esc(a.start)} - ${esc(a.end)}</dd><dt>Estado</dt><dd>${esc(a.status)}</dd></dl></div><div class="buttons"><button class="btn" data-print="${a.id}">Descargar PDF</button><button class="btn" data-share="${a.id}">Compartir</button><button class="btn" data-go="visitorHome">Menú principal</button></div>`}
    function printable(title,html){const w=window.open('','_blank','width=760,height=800');if(!w){toast('El navegador bloqueó la ventana de impresión.');return}w.document.write(`<html><head><title>${esc(title)}</title><style>body{font-family:Arial;padding:30px;color:#111}h1{font-size:22px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #aaa;padding:7px;text-align:left}</style></head><body><h1>${esc(title)}</h1>${html}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),250)}
    function exportCsv(arr,name){const rows=[['Fecha','Almacén','Motivo','Cantidad de elementos de prueba','Hora inicio','Hora final','Estado'],...arr.map(a=>[a.date,a.warehouse,a.motive,a.qty,a.start,a.end,a.status])];const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),300)}
    async function shareText(text){if(navigator.share){try{await navigator.share({title:'Sistema de Turnos',text});return}catch(e){}}if(navigator.clipboard){await navigator.clipboard.writeText(text);toast('Información copiada para compartir.')}else toast('Compartir no está disponible en este navegador.')}
    function validPassword(p){return p.length>=8&&/[A-ZÁÉÍÓÚÑ]/.test(p)&&/[0-9]/.test(p)&&/[^A-Za-zÁÉÍÓÚáéíóúÑñ0-9]/.test(p)}
    function emailDomain(email){return String(email||'').trim().toLowerCase().split('@')[1]||''}
    function onlyDigits(v){return String(v||'').replace(/\D/g,'')}
    function validName(v){return /^[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+$/.test(String(v||'').trim())}
    function authorizationFor(email,doc){return (db.adminAuthorizations||[]).find(a=>a.email.toLowerCase()===String(email).toLowerCase()||a.doc===String(doc))||null}
    function profileOptions(role){if(role==='admin')return `<option>Administrador de almacén</option>`;return `<option>Policía Judicial</option><option>Asistente</option><option>Fiscal</option><option>Defensa</option><option>Particular</option><option>Otro</option>`}
    function entityOptions(role){if(role==='admin')return `<option>Fiscalía General de la Nación</option>`;return `<option>Fiscalía General de la Nación</option><option>Policía Nacional</option><option>Otro</option>`}
    const views={
      splash:()=>`<div class="splash"><h1>SISTEMA DE TURNOS<br>PARA ALMACENES</h1><div class="loader"></div></div>`,
      home:()=>`<div class="center"><div class="spacer-lg"></div><h1>SISTEMA DE TURNOS<br>PARA ALMACENES</h1><div class="spacer-xl"></div><p>Atención organizada para entrega, salida y devolución de elementos de prueba.</p><div class="spacer-lg"></div><div class="buttons stack"><button class="btn" data-go="policyGate">Registrarse</button><button class="btn" data-go="login">Ingresar</button></div><div class="spacer-lg"></div><p class="tiny">Prototipo funcional de una herramienta genérica para organización de turnos.</p></div>`,
      policyGate:()=>`<h2>Tratamiento de datos</h2><p class="muted">Antes de registrarse debe consultar y aceptar la Política Marco para el Tratamiento de Datos Personales.</p><div class="note">La aceptación se solicita únicamente para nuevos registros. Los usuarios ya registrados pueden ingresar sin repetir este paso.</div><div class="buttons"><button class="btn" type="button" data-go="policy">Leer política completa</button></div><form id="policyForm" class="form" style="margin-top:24px"><label class="check"><input type="checkbox" name="accept" ${state.policyAccepted?'checked':''} ${state.policyViewed?'':'disabled'}>He leído la Política de Tratamiento de Datos Personales y autorizo el tratamiento de mis datos para las finalidades informadas.</label>${state.policyViewed?'':'<p class="tiny">Primero abra la política completa para habilitar la aceptación.</p>'}<div class="buttons"><button class="btn" type="submit" ${state.policyViewed?'':'disabled'}>Continuar</button><button class="btn" type="button" data-go="home">Volver</button></div></form>`,
      policy:()=>{state.policyViewed=true;return `<h2>Política de tratamiento de datos</h2><div style="max-height:520px;overflow:auto;border:1px solid #bbb;padding:12px;font-size:11px;line-height:1.45"><p><strong>Versión 1.1</strong></p><h3>1. Naturaleza y finalidad</h3><p>El Sistema es una herramienta tecnológica genérica destinada a organizar, ordenar y gestionar la asignación y atención de turnos en almacenes, depósitos, centros de recepción, puntos de atención o dependencias que desarrollen actividades relacionadas con la recepción, entrega, consulta, administración, custodia o gestión de bienes, elementos, documentos, mercancías, inventarios u otros objetos.</p><p>Su naturaleza es administrativa y operativa. No está diseñado para almacenar información propia de expedientes judiciales, investigaciones, procesos administrativos, historias clínicas, antecedentes, información financiera, datos biométricos ni otras categorías que excedan lo estrictamente necesario para identificar al usuario, asignarle un turno y gestionar su atención.</p><h3>2. Responsable del tratamiento</h3><p>La persona natural o jurídica, pública o privada, que implemente el Sistema y determine las finalidades, condiciones y medios esenciales del tratamiento tendrá la calidad de Responsable del Tratamiento. Antes de utilizar datos personales reales deberá completar su identificación, NIT o documento, domicilio, dirección, correo de protección de datos, teléfono y, cuando corresponda, sitio web.</p><h3>3. Información objeto de tratamiento</h3><p>Según el tipo de usuario y únicamente cuando resulte necesario para prestar el servicio, el Sistema podrá recolectar nombre completo, tipo y número de identificación, correo electrónico, número de teléfono, entidad a la que pertenece, cargo, función o rol, ciudad de inscripción y, para perfiles administrativos, almacén o punto de atención asociado.</p><p>También podrá conservar los datos estrictamente necesarios para demostrar la autorización otorgada para el tratamiento, incluida la versión de esta Política aceptada y la fecha y hora de aceptación. Como consecuencia del uso del Sistema podrán generarse datos operativos del turno, como fecha, hora, sede, tipo de servicio, estado, tiempos de espera y atención y demás variables estrictamente necesarias para administrar el flujo y obtener estadísticas de funcionamiento.</p><h3>4. Finalidades</h3><p>Los datos se utilizarán para identificar al usuario, registrar solicitudes, asignar y gestionar turnos, comunicar asignaciones, confirmaciones, modificaciones, cancelaciones o finalizaciones, analizar el funcionamiento, medir demanda y tiempos, prestar soporte y proteger la seguridad del Sistema.</p><p>No podrán utilizarse por el solo hecho de haber sido suministrados para fines publicitarios, promocionales, comerciales, elaboración de perfiles de consumo, venta de información o finalidades ajenas a las informadas.</p><h3>5. Principios</h3><p>El tratamiento observará legalidad, finalidad, libertad, veracidad o calidad, transparencia, acceso y circulación restringida, seguridad y confidencialidad. La información deberá ser adecuada, pertinente y limitada a lo necesario.</p><h3>6. Autorización e información</h3><p>Cuando la legislación colombiana exija autorización, esta deberá obtenerse antes o al momento de la recolección mediante un procedimiento que permita demostrar un consentimiento libre, previo, expreso e informado. El usuario deberá poder conocer al Responsable, los datos recolectados, las finalidades, sus derechos y los mecanismos para consultar esta Política.</p><h3>7. Derechos de los titulares</h3><p>El Titular podrá conocer, actualizar, rectificar y acceder a sus datos; solicitar información sobre su uso; obtener prueba de la autorización cuando sea exigible; solicitar supresión o revocatoria cuando proceda; y formular consultas o reclamos.</p><h3>8. Consultas y reclamos</h3><p>Cada implementación deberá establecer canales para consultas, solicitudes y reclamos y completar el correo electrónico, dirección física u otros mecanismos aplicables.</p><h3>9. Seguridad y confidencialidad</h3><p>El Responsable y los Encargados deberán adoptar medidas técnicas, humanas, administrativas y organizativas razonables para impedir pérdida, adulteración, acceso, modificación, uso, circulación o divulgación no autorizada. El acceso deberá limitarse a quienes lo requieran para finalidades autorizadas.</p><h3>10. Registro interno de autorización administrativa</h3><p>Para perfiles con permisos administrativos, el Sistema podrá contrastar los datos suministrados durante el registro con un registro interno de usuarios autorizados administrado por el Responsable, exclusivamente para habilitar, mantener, suspender o revocar permisos de acceso. Esta verificación no se utilizará para elaborar perfiles personales, enriquecer información del usuario ni realizar finalidades diferentes del control de acceso.</p><p>El registro podrá manejar estados como ACTIVO, INACTIVO, PENDIENTE y RECHAZADO, conservando trazabilidad de los cambios sin necesidad de eliminar físicamente los registros.</p><h3>11. Intervención de terceros</h3><p>Si se utilizan servicios de alojamiento, nube, comunicaciones, mantenimiento o soporte que impliquen acceso a datos, el Responsable deberá verificar condiciones adecuadas de seguridad y confidencialidad y definir las obligaciones del Encargado.</p><h3>12. Conservación y eliminación</h3><p>Cada implementación deberá definir previamente un periodo razonable de conservación. Finalizado el término aplicable, los datos deberán eliminarse de forma segura o anonimizarse cuando corresponda.</p><h3>13. Prototipos y pilotos</h3><p>Siempre que resulte posible, las pruebas deberán utilizar información ficticia, sintética o anonimizada. Si un piloto trata datos de personas reales, deberá cumplir esta Política y la legislación aplicable.</p><h3>14. Limitaciones</h3><p>El Sistema no autoriza por sí mismo consultas de bases externas sobre los usuarios, enriquecimiento de información, venta o cesión de bases de datos, publicidad ni recolección de datos sensibles sin análisis jurídico previo y garantías adicionales.</p><h3>15. Modificaciones</h3><p>La Política podrá actualizarse por cambios normativos, tecnológicos, funcionales u operativos. Los cambios sustanciales en finalidades deberán ser informados y, cuando corresponda, requerir nueva autorización.</p><h3>16. Vigencia e identificación de la implementación</h3><p>Antes del uso con datos reales deberán completarse: Responsable del Tratamiento, NIT o identificación, domicilio, dirección, correo de protección de datos, teléfono, periodo de conservación, fecha de entrada en vigencia y fecha de última actualización.</p></div><div class="buttons"><button class="btn" type="button" data-go="policyGate">Volver y aceptar</button></div>`},
      chooseRole:()=>`<h2>Registro</h2><p class="muted center">Seleccione el tipo de usuario.</p><form id="roleForm" class="form"><div class="choice"><label><input type="radio" name="role" value="visitor" checked><span><strong>Visitante almacén</strong><br>Permite agendar citas para entregar, recibir o devolver elementos de prueba.</span></label><label><input type="radio" name="role" value="admin"><span><strong>Administrador de almacén</strong><br>Permite seguimiento, control y ajustes a visitas programadas o canceladas. Perfil restringido.</span></label></div><div class="buttons"><button class="btn" type="submit">Siguiente</button><button class="btn" type="button" data-go="home">Salir</button></div></form>`,
      register1:()=>{const r=state.registerRole;return `<h2>Registro ${r==='admin'?'Administrador':'Visitante'}</h2><form id="reg1" class="form"><label>Nombre completo *<input name="name" required autocomplete="name" value="${esc(state.registerDraft.name||'')}"></label><label>Tipo de documento *<select name="docType" required><option>C.C.</option><option>C.E.</option><option>Pasaporte</option></select></label><label>Número documento *<input name="doc" required inputmode="numeric" pattern="[0-9]*" value="${esc(state.registerDraft.doc||'')}"></label><label>Correo electrónico *<input name="email" type="email" required value="${esc(state.registerDraft.email||'')}"></label><label>Número de celular *<input name="phone" required inputmode="numeric" pattern="[0-9]*" value="${esc(state.registerDraft.phone||'')}"></label><label>Entidad *<select name="entity">${entityOptions(r)}</select></label><label>Cargo / Función / Rol *<select name="job">${profileOptions(r)}</select></label><div class="buttons"><button class="btn" type="submit">Siguiente</button><button class="btn" type="button" data-go="home">Salir</button></div></form>`},
      register2:()=>{const r=state.registerRole;return `<h2>Registro ${r==='admin'?'Administrador':'Visitante'}</h2><form id="reg2" class="form">${r==='admin'?`<label>Almacén *<select name="warehouse">${warehouses.map(x=>`<option>${x}</option>`).join('')}</select></label>`:`<label>Ciudad de inscripción *<select name="city">${cities.map(x=>`<option>${x}</option>`).join('')}</select></label>`}<label>Usuario<input value="${esc(state.registerDraft.email||'')}" readonly></label><label>Contraseña *<input name="password" type="password" required></label><p class="tiny">Mínimo 8 caracteres, debe incluir mayúscula, número y símbolo.</p><label>Confirmar contraseña *<input name="confirm" type="password" required></label><div class="note">La Política de Tratamiento de Datos Personales ya fue consultada y aceptada antes de iniciar este registro.</div><div class="buttons"><button class="btn" type="submit">Registrarse</button><button class="btn" type="button" data-go="home">Salir</button></div></form>`},
      visitorVerify:()=>`<div class="center"><div class="spacer-lg"></div><h2>Registro Visitante</h2><div class="loader" style="margin:25px auto"></div><p>Estamos validando tu registro.</p><p class="muted">Para este prototipo la validación se simula automáticamente. En una implementación conectada podrá realizarse mediante un servicio seguro de verificación.</p></div>`,
      adminCode:()=>`<h2>Registro Administrador</h2><p class="center">Código de confirmación</p><div class="code" id="codeBox"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div><p class="muted center">El código se enviaría por mensaje de texto al número celular del registro.</p><div class="note"><strong>Prototipo:</strong> use el código <strong>1111</strong>. Tiene tres oportunidades.</div><div id="codeMsg"></div><div class="buttons"><button class="btn" id="validateCode">Validar</button></div>`,
      welcome:()=>`<div class="center"><div class="spacer-lg"></div><h2>Bienvenido</h2><p>En esta aplicación web podrás gestionar trámites y turnos de atención para retiro, entrega o devolución de elementos de prueba en almacenes.</p><div class="buttons stack"><button class="btn" data-go="${currentUser()?.role==='admin'?'adminHome':'visitorHome'}">Siguiente</button><button class="btn" id="logoutBtn">Salir</button></div></div>`,
      login:()=>`<h1>SISTEMA DE TURNOS<br>PARA ALMACENES</h1><form id="loginForm" class="form" style="margin-top:70px"><label>Usuario:<input name="email" type="email" required value="pedro.perez@correo.policia.gov.co"></label><label>Contraseña:<input name="password" type="password" required value="Pedroperez64*"></label><p class="muted center">¿Olvidaste tu contraseña o usuario?</p><p class="muted center">Enviaremos a tu correo electrónico registrado un enlace que te permitirá recuperarlos.</p><div id="loginMsg"></div><div class="buttons stack" style="margin-top:62px"><button class="btn" type="submit">Entrar</button><button type="button" class="btn" data-go="recover">Recuperar clave</button></div></form>`,
      recover:()=>`<h2>Recuperar clave</h2><p class="muted center">Ingrese el correo registrado. En producción se enviaría un enlace de restablecimiento.</p><form id="recoverForm" class="form"><label>Correo electrónico<input name="email" type="email" required></label><div class="buttons"><button class="btn" type="submit">Enviar enlace</button><button class="btn" type="button" data-go="login">Volver</button></div></form>`,
      visitorHome:()=>`<h2>Menú principal</h2><div class="menu"><button data-go="profile"><strong>Mi perfil</strong><small>Información del registro y fotografía.</small></button><button data-go="history"><strong>Historial de citas</strong><small>Consulta, PDF y Excel.</small></button><button data-go="book"><strong>Agendar una cita</strong><small>Entrega, Salida o Devolución de elementos de prueba.</small></button><button data-go="cancel"><strong>Cancelar una cita</strong><small>Solo con mínimo una hora de anterioridad.</small></button><button data-go="notifications"><strong>Notificaciones</strong><small>Recordatorios, cancelaciones y novedades.</small></button><button data-go="help"><strong>Ayuda</strong><small>Soporte relacionado con la aplicación.</small></button><button data-go="pqrsf"><strong>PQRSF</strong><small>Petición, Queja, Reclamo, Sugerencia o Felicitación.</small></button></div><div class="buttons"><button class="btn" id="logoutBtn">Salir</button></div>`,
      profile:()=>{const u=currentUser();return `<h2>Mi perfil</h2><form id="profileForm" class="form"><div class="photo-control"><div class="avatar">${u.photo?`<img src="${u.photo}">`:esc(u.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><input type="file" id="photoInput" accept="image/*"></div><label>Nombre completo<input name="name" value="${esc(u.name)}"></label><label>Tipo documento<input value="${esc(u.docType)}" readonly></label><label>Número documento<input value="${esc(u.doc)}" readonly></label><label>Correo<input name="email" type="email" value="${esc(u.email)}"></label><label>Número celular<input name="phone" value="${esc(u.phone)}"></label><label>Entidad<select name="entity">${entityOptions('visitor')}</select></label><label>Cargo / Función / Rol<select name="job">${profileOptions('visitor')}</select></label><label>Ciudad<select name="city">${cities.map(c=>`<option ${c===u.city?'selected':''}>${c}</option>`).join('')}</select></label><div class="buttons"><button class="btn" type="submit">Editar</button><button class="btn" type="button" data-go="visitorHome">Menú principal</button></div></form>`},
      history:()=>{const arr=getUserAppointments(state.session);return `<h2>Historial de citas</h2>${tableAppointments(arr)}<div class="buttons"><button class="btn" id="printHistory">Descargar PDF</button><button class="btn" id="excelHistory">Descargar Excel</button><button class="btn" id="shareHistory">Compartir</button><button class="btn" data-go="visitorHome">Menú principal</button></div>`},
      book:()=>{const u=currentUser();const min=new Date(Date.now()+86400000).toISOString().slice(0,10);return `<h2>Agendamiento de citas</h2><form id="bookForm" class="form"><label>Almacén<select name="warehouse">${warehouses.map(w=>`<option>${w}</option>`).join('')}</select></label><label>Motivo visita<select name="motive"><option>Entrega</option><option>Salida</option><option>Devolución</option></select></label><label>Cantidad de elementos de prueba<select name="qty"><option>1-5</option><option>6-10</option><option>11-15</option><option>16-20</option><option>Más de 20</option></select></label><label>Agenda disponible<input name="date" type="date" min="${min}" required></label><div id="agendaNotice"></div><div><div class="section-title">Hora disponible</div><div class="slots" id="slotBox"><span class="muted">Seleccione almacén, cantidad y fecha.</span></div></div><div class="note"><strong>Regla demostrativa del prototipo:</strong> 1-5 = 30 min; 6-10 = 60; 11-15 = 90; 16-20 = 120; más de 20 = 150. La relación está parametrizada para poder cambiarla.</div><div class="buttons"><button class="btn" type="submit">Agendar</button><button class="btn" type="button" data-go="visitorHome">Menú principal</button></div></form>`},
      booked:()=>summaryAppointment(state.lastAppointment,'Cita agendada'),
      cancel:()=>`<h2>Cancelar una cita</h2>${tableAppointments(getUserAppointments(state.session).filter(a=>a.status==='Programada'),true)}<div class="note">Las citas deben cancelarse con mínimo una hora de anterioridad. Una vez cancelada, debe realizarse un nuevo agendamiento.</div><div class="buttons"><button class="btn" data-go="visitorHome">Menú principal</button></div>`,
      cancelled:()=>summaryAppointment(state.lastAppointment,'Cita cancelada'),
      notifications:()=>{const arr=db.notifications.filter(n=>n.recipient===state.session);return `<h2>Notificaciones</h2>${arr.map(n=>`<div class="notification"><strong>${esc(n.title)}</strong><p>${esc(n.text)}</p><time>${fmtDate(n.date)}</time></div>`).join('')||'<p class="muted center">No hay notificaciones.</p>'}<div class="buttons"><button class="btn" data-go="visitorHome">Menú principal</button></div>`},
      help:()=>`<h2>Ayuda</h2><form id="helpForm" class="form"><label>Describir requerimiento<textarea name="text" maxlength="200" required></textarea></label><label>Subir archivo (opcional)<input name="file" type="file" accept="application/pdf,image/*"></label><p class="muted center">Máximo 200 caracteres. La respuesta se enviaría al correo registrado.</p><div class="buttons"><button class="btn" type="submit">Enviar</button><button class="btn" type="button" data-go="visitorHome">Menú principal</button></div></form>`,
      pqrsf:()=>`<h2>PQRSF</h2><form id="pqForm" class="form"><label>¿Qué desea presentar?<select name="type"><option>Petición</option><option>Queja</option><option>Reclamo</option><option>Sugerencia</option><option>Felicitación</option></select></label><label>Almacén de evidencias<select name="warehouse">${warehouses.map(w=>`<option>${w}</option>`).join('')}</select></label><label>Describir requerimiento<textarea name="text" maxlength="100" required></textarea></label><p class="muted center">Máximo 100 caracteres.</p><div class="buttons"><button class="btn" type="submit">Enviar</button><button class="btn" type="button" data-go="visitorHome">Menú principal</button></div></form>`,
      adminHome:()=>`<h2>Menú principal</h2><div class="menu"><button data-go="adminProfile"><strong>Mi perfil</strong><small>Datos del registro. Solo la contraseña es editable.</small></button><button data-go="stats"><strong>Estadísticas</strong><small>Movimiento de citas del Almacén.</small></button><button data-go="agenda"><strong>Agenda</strong><small>Administrar días, horas y cierres.</small></button><button data-go="userAppointments"><strong>Citas agendadas por usuarios</strong><small>Consulta por documento y periodo.</small></button><button data-go="adminNotifications"><strong>Notificaciones</strong><small>Agendamientos y cancelaciones.</small></button><button data-go="adminHelp"><strong>Ayuda</strong><small>Soporte de la aplicación.</small></button><button data-go="messages"><strong>Mensajes</strong><small>Mensajes masivos a Visitantes.</small></button></div><div class="buttons"><button class="btn" id="logoutBtn">Salir</button></div>`,
      adminProfile:()=>{const u=currentUser();return `<h2>Mi perfil</h2><form id="adminProfileForm" class="form"><div class="photo-control"><div class="avatar">${u.photo?`<img src="${u.photo}">`:esc(u.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><input type="file" id="photoInput" accept="image/*"></div><div class="summary"><dl><dt>Nombre</dt><dd>${esc(u.name)}</dd><dt>Documento</dt><dd>${esc(u.docType)} ${esc(u.doc)}</dd><dt>Correo</dt><dd>${esc(u.email)}</dd><dt>Celular</dt><dd>${esc(u.phone)}</dd><dt>Entidad</dt><dd>${esc(u.entity)}</dd><dt>Rol</dt><dd>${esc(u.job)}</dd><dt>Almacén</dt><dd>${esc(u.warehouse)}</dd><dt>Usuario</dt><dd>${esc(u.email)}</dd></dl></div><label>Nueva contraseña<input name="password" type="password" placeholder="Dejar vacío para no cambiar"></label><div class="buttons"><button class="btn" type="submit">Editar</button><button class="btn" type="button" data-go="adminHome">Menú principal</button></div></form>`},
      stats:()=>{const u=currentUser();const arr=getAdminAppointments(u);const f=state.statsFilter||{from:'2026-08-01',to:'2026-08-31'};const filtered=arr.filter(a=>a.date>=f.from&&a.date<=f.to);const byMotive={Entrega:0,Salida:0,Devolución:0};filtered.forEach(a=>byMotive[a.motive]=(byMotive[a.motive]||0)+1);const max=Math.max(1,...Object.values(byMotive));const roles={};filtered.forEach(a=>{const usr=db.users.find(x=>x.id===a.userId);const k=usr?.job||'Sin dato';roles[k]=(roles[k]||0)+1});return `<h2>Estadísticas</h2><form id="statsForm" class="form"><label>Fecha inicio<input name="from" type="date" value="${f.from}"></label><label>Fecha final<input name="to" type="date" value="${f.to}"></label><div class="buttons"><button class="btn" type="submit">Filtrar</button></div></form><div class="stats"><div class="stat"><span>Total citas</span><strong>${filtered.length}</strong></div><div class="stat"><span>Usuarios distintos</span><strong>${new Set(filtered.map(a=>a.userId)).size}</strong></div><div class="stat"><span>Días agendados</span><strong>${new Set(filtered.map(a=>a.date)).size}</strong></div><div class="stat"><span>Elementos de prueba</span><strong>${filtered.reduce((s,a)=>s+(parseInt(a.qty)||20),0)}</strong></div></div><div class="section-title">Participación por motivo</div><div class="bars">${Object.entries(byMotive).map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b>${v}</b></div>`).join('')}</div><div class="section-title">Participación por cargo / función / rol</div><div class="bars">${Object.entries(roles).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="bar"><i style="width:${filtered.length?v/filtered.length*100:0}%"></i></div><b>${v}</b></div>`).join('')||'<p class="muted">Sin datos.</p>'}</div>${tableAppointments(filtered)}<div class="note">Los indicadores reproducen la estructura de la propuesta. Sus fórmulas definitivas deben validarse antes de producción.</div><div class="buttons"><button class="btn" id="printStats">Descargar PDF</button><button class="btn" id="shareStats">Compartir</button><button class="btn" data-go="adminHome">Menú principal</button></div>`},
      agenda:()=>{const u=currentUser();return `<h2>Agenda</h2><p class="muted center">Ajustar agenda del Almacén de Evidencias ${esc(u.warehouse)}.</p><form id="agendaForm" class="form"><label>Fecha inicio<input name="from" type="date" required></label><label>Fecha final<input name="to" type="date" required></label><label>Hora inicio<input name="start" type="time" value="08:00" required></label><label>Hora final<input name="end" type="time" value="17:00" required></label><label>Mensaje a publicar<textarea name="message" maxlength="200" placeholder="Ej. Almacén cerrado por inventario."></textarea></label><div class="buttons"><button class="btn" type="submit">Publicar</button><button class="btn" type="button" data-go="adminHome">Menú principal</button></div></form><div class="section-title">Ajustes publicados</div>${db.closures.filter(c=>c.warehouse===u.warehouse).map(c=>`<div class="notification"><strong>${fmtDate(c.from)} a ${fmtDate(c.to)}</strong><p>${esc(c.start)} - ${esc(c.end)}. ${esc(c.message)}</p></div>`).join('')||'<p class="muted center">No hay ajustes publicados.</p>'}`},
      userAppointments:()=>{const u=currentUser(),f=state.userFilter||{from:'2026-08-01',to:'2026-08-31',doc:''};let arr=getAdminAppointments(u).filter(a=>a.date>=f.from&&a.date<=f.to);if(f.doc){const ids=db.users.filter(x=>x.doc.replace(/\D/g,'')===f.doc.replace(/\D/g,'')).map(x=>x.id);arr=arr.filter(a=>ids.includes(a.userId))}return `<h2>Citas agendadas por usuario</h2><form id="userFilterForm" class="form"><label>Fecha inicio<input name="from" type="date" value="${f.from}"></label><label>Fecha final<input name="to" type="date" value="${f.to}"></label><label>No. documento del usuario<input name="doc" value="${esc(f.doc)}"></label><div class="buttons"><button class="btn" type="submit">Filtrar</button></div></form>${tableAppointments(arr)}<div class="buttons"><button class="btn" id="printUserAppointments">Descargar PDF</button><button class="btn" id="shareUserAppointments">Compartir</button><button class="btn" data-go="adminHome">Menú principal</button></div>`},
      adminNotifications:()=>{const arr=db.notifications.filter(n=>n.recipient===state.session);return `<h2>Notificaciones</h2>${arr.map(n=>`<div class="notification"><strong>${esc(n.title)}</strong><p>${esc(n.text)}</p><time>${fmtDate(n.date)}</time></div>`).join('')||'<p class="muted center">No hay notificaciones.</p>'}<div class="buttons"><button class="btn" data-go="adminHome">Menú principal</button></div>`},
      adminHelp:()=>`<h2>Ayuda</h2><form id="helpForm" class="form"><label>Describir requerimiento<textarea name="text" maxlength="200" required></textarea></label><label>Subir archivo (opcional)<input name="file" type="file" accept="application/pdf,image/*"></label><p class="muted center">Máximo 200 caracteres. La respuesta se enviaría al correo registrado.</p><div class="buttons"><button class="btn" type="submit">Enviar</button><button class="btn" type="button" data-go="adminHome">Menú principal</button></div></form>`,
      messages:()=>{const u=currentUser();return `<h2>Mensajes</h2><p class="muted center">Se enviará a Visitantes relacionados con la ciudad ${esc(u.city)}. En este prototipo “relacionado” significa ciudad de inscripción.</p><form id="messageForm" class="form"><label>Escribir mensaje<textarea name="text" maxlength="200" required placeholder="Ej. El almacén no abrirá al público por fumigación."></textarea></label><p class="muted center">Máximo 200 caracteres.</p><div class="buttons"><button class="btn" type="submit">Publicar</button><button class="btn" type="button" data-go="adminHome">Menú principal</button></div></form>`}
    };
    function bind(){
      screen.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
      screen.querySelectorAll('#logoutBtn').forEach(b=>b.addEventListener('click',()=>{state.session=null;go('home')}));
      const policyForm=$('#policyForm');if(policyForm)policyForm.addEventListener('submit',e=>{e.preventDefault();const accepted=new FormData(policyForm).get('accept')==='on';if(!state.policyViewed||!accepted){toast('Debe consultar y aceptar la política para continuar.');return}state.policyAccepted=true;go('chooseRole')});
      const roleForm=$('#roleForm');if(roleForm)roleForm.addEventListener('submit',e=>{e.preventDefault();state.registerRole=new FormData(roleForm).get('role');state.registerDraft={};go('register1')});
      const reg1=$('#reg1');if(reg1){const doc=reg1.elements.doc,phone=reg1.elements.phone,name=reg1.elements.name;[doc,phone].forEach(el=>el.addEventListener('input',()=>el.value=onlyDigits(el.value)));name.addEventListener('input',()=>name.value=name.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñÜü ]/g,''));reg1.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(reg1));f.doc=onlyDigits(f.doc);f.phone=onlyDigits(f.phone);if(!validName(f.name)){toast('El nombre solo puede contener letras, tildes y espacios.');return}if(!f.doc||!f.phone){toast('Documento y celular deben contener únicamente números.');return}const domain=emailDomain(f.email);if(state.registerRole==='visitor'&&!allowedVisitorDomains.includes(domain)){toast('El correo del Visitante debe pertenecer a un dominio institucional autorizado.');return}if(state.registerRole==='admin'&&domain!==allowedAdminDomain){toast('El Administrador debe usar un correo institucional autorizado.');return}state.registerDraft={...state.registerDraft,...f};go('register2')})}
      const reg2=$('#reg2');if(reg2)reg2.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(reg2));if(f.password!==f.confirm){toast('Las contraseñas no coinciden.');return}if(!validPassword(f.password)){toast('La contraseña no cumple la complejidad mínima.');return}if(db.users.some(u=>u.email.toLowerCase()===state.registerDraft.email.toLowerCase())){toast('Ese correo ya está registrado.');return}state.registerDraft={...state.registerDraft,...f};if(state.registerRole==='admin')go('adminCode');else{go('visitorVerify');setTimeout(()=>completeRegistration('visitor'),1700)}});
      const codeBtn=$('#validateCode');if(codeBtn)codeBtn.addEventListener('click',()=>{const auth=authorizationFor(state.registerDraft.email,state.registerDraft.doc);if(!auth){db.adminAuthorizations=db.adminAuthorizations||[];db.adminAuthorizations.push({doc:state.registerDraft.doc,name:state.registerDraft.name,email:state.registerDraft.email,warehouse:state.registerDraft.warehouse,status:'PENDIENTE',updatedAt:nowISODate(),authorizedBy:''});save();$('#codeMsg').innerHTML='<div class="note">Su solicitud quedó en estado PENDIENTE. En una versión conectada se enviará automáticamente a los responsables de autorización.</div>';codeBtn.disabled=true;return}if(auth.status!=='ACTIVO'){$('#codeMsg').innerHTML=`<div class="error">Acceso no habilitado. Estado actual: ${esc(auth.status)}.</div>`;codeBtn.disabled=true;return}const code=[...screen.querySelectorAll('#codeBox input')].map(i=>i.value).join('');if(code===state.adminCode){completeRegistration('admin')}else{state.adminAttempts++;const msg=$('#codeMsg');if(state.adminAttempts>=3){msg.innerHTML='<div class="error">No fue posible validar su código. La solicitud requiere revisión.</div>';codeBtn.disabled=true;db.support.push({id:'s'+Date.now(),user:'Registro administrador',text:'Validación manual requerida para nuevo Administrador.',date:nowISODate()});save()}else msg.innerHTML=`<div class="error">Código no valedero. Intente de nuevo. Intentos restantes: ${3-state.adminAttempts}.</div>`}});
      const login=$('#loginForm');if(login)login.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(login));const u=db.users.find(u=>u.email.toLowerCase()===String(f.email).toLowerCase()&&u.password===f.password&&u.active);if(!u){$('#loginMsg').innerHTML='<div class="error">Usuario o contraseña no registrados</div>';return}if(u.role==='admin'){const auth=authorizationFor(u.email,u.doc);if(!auth||auth.status!=='ACTIVO'){$('#loginMsg').innerHTML=`<div class="error">Acceso administrativo no habilitado${auth?`. Estado: ${esc(auth.status)}`:''}.</div>`;return}}state.session=u.id;go(u.role==='admin'?'adminHome':'visitorHome')});
      const recover=$('#recoverForm');if(recover)recover.addEventListener('submit',e=>{e.preventDefault();const email=new FormData(recover).get('email');toast(db.users.some(u=>u.email.toLowerCase()===String(email).toLowerCase())?'Se simuló el envío del enlace de recuperación.':'El correo no está registrado.');go('login')});
      const profile=$('#profileForm');if(profile)profile.addEventListener('submit',e=>{e.preventDefault();const u=currentUser(),f=Object.fromEntries(new FormData(profile));Object.assign(u,{name:f.name,email:f.email,phone:f.phone,entity:f.entity,job:f.job,city:f.city});save();toast('Perfil actualizado.');render()});
      const adminProfile=$('#adminProfileForm');if(adminProfile)adminProfile.addEventListener('submit',e=>{e.preventDefault();const p=new FormData(adminProfile).get('password'),u=currentUser();if(p){if(!validPassword(p)){toast('La nueva contraseña no cumple la complejidad mínima.');return}u.password=p;save()}toast('Perfil actualizado.');render()});
      const photo=$('#photoInput');if(photo)photo.addEventListener('change',()=>{const file=photo.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{currentUser().photo=r.result;save();render()};r.readAsDataURL(file)});
      const book=$('#bookForm');if(book){const refresh=()=>{const f=new FormData(book),w=f.get('warehouse'),q=f.get('qty'),d=f.get('date');const notice=$('#agendaNotice');notice.innerHTML=d&&calendarNotice(w,d)?`<div class="note"><strong>Novedad de agenda:</strong> ${esc(calendarNotice(w,d))}</div>`:'';const slots=slotOptions(w,d,q);state.selectedSlot=null;$('#slotBox').innerHTML=slots.length?slots.map(s=>`<button type="button" class="slot" data-slot="${s.start}|${s.end}">${s.start} - ${s.end}</button>`).join(''):'<span class="muted">No hay horarios disponibles para esa combinación.</span>';$('#slotBox').querySelectorAll('.slot').forEach(b=>b.addEventListener('click',()=>{state.selectedSlot=b.dataset.slot;$('#slotBox').querySelectorAll('.slot').forEach(x=>x.classList.toggle('selected',x===b))}))};book.querySelectorAll('select,input[type=date]').forEach(x=>x.addEventListener('change',refresh));book.addEventListener('submit',e=>{e.preventDefault();if(!state.selectedSlot){toast('Seleccione una hora disponible.');return}const f=new FormData(book),[start,end]=state.selectedSlot.split('|');const a={id:'ap'+Date.now(),userId:state.session,warehouse:f.get('warehouse'),motive:f.get('motive'),qty:f.get('qty'),date:f.get('date'),start,end,status:'Programada',createdAt:new Date().toISOString()};db.appointments.unshift(a);state.lastAppointment=a;notify(state.session,'Agendamiento de cita',`Tiene una cita programada el ${fmtDate(a.date)} a las ${a.start} en el Almacén de Evidencias ${a.warehouse}.`);db.users.filter(u=>u.role==='admin'&&u.warehouse===a.warehouse).forEach(u=>notify(u.id,'Agendamiento de cita',`Se agendó una cita para el ${fmtDate(a.date)} a las ${a.start}.`));save();go('booked')});refresh()}
      screen.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',()=>{const a=db.appointments.find(x=>x.id===b.dataset.cancel);if(!a||!eligibleCancel(a)){toast('La cita ya no puede cancelarse porque falta menos de una hora.');return}a.status='Cancelada';state.lastAppointment=a;notify(state.session,'Cancelación de cita',`Se canceló la cita del ${fmtDate(a.date)} a las ${a.start} en ${a.warehouse}.`);db.users.filter(u=>u.role==='admin'&&u.warehouse===a.warehouse).forEach(u=>notify(u.id,'Cancelación de cita',`Se canceló la cita del ${fmtDate(a.date)} a las ${a.start}.`));save();go('cancelled')}));
      screen.querySelectorAll('[data-print]').forEach(b=>b.addEventListener('click',()=>{const a=db.appointments.find(x=>x.id===b.dataset.print);printable('Resumen de cita',`<p><b>Almacén:</b> ${esc(a.warehouse)}</p><p><b>Motivo:</b> ${esc(a.motive)}</p><p><b>Cantidad:</b> ${esc(a.qty)}</p><p><b>Fecha:</b> ${fmtDate(a.date)}</p><p><b>Hora:</b> ${a.start} - ${a.end}</p><p><b>Estado:</b> ${esc(a.status)}</p>`)}));
      screen.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',()=>{const a=db.appointments.find(x=>x.id===b.dataset.share);shareText(`Cita ${a.status}: ${fmtDate(a.date)} ${a.start}-${a.end}, ${a.warehouse}, ${a.motive}, ${a.qty} elementos de prueba.`)}));
      const printHistory=$('#printHistory');if(printHistory)printHistory.addEventListener('click',()=>printable('Historial de citas',tableAppointments(getUserAppointments(state.session))));
      const excelHistory=$('#excelHistory');if(excelHistory)excelHistory.addEventListener('click',()=>exportCsv(getUserAppointments(state.session),'historial-citas'));
      const shareHistory=$('#shareHistory');if(shareHistory)shareHistory.addEventListener('click',()=>shareText(`Historial de citas: ${getUserAppointments(state.session).length} registros.`));
      const help=$('#helpForm');if(help)help.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(help);db.support.unshift({id:'s'+Date.now(),userId:state.session,text:f.get('text'),date:nowISODate()});save();toast('Solicitud de ayuda enviada.');go(currentUser().role==='admin'?'adminHome':'visitorHome')});
      const pq=$('#pqForm');if(pq)pq.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(pq));db.pqrsf.unshift({id:'p'+Date.now(),userId:state.session,...f,date:nowISODate()});save();toast('PQRSF enviada.');go('visitorHome')});
      const agenda=$('#agendaForm');if(agenda)agenda.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(agenda));if(f.to<f.from){toast('La fecha final no puede ser anterior a la fecha inicial.');return}db.closures.unshift({id:'c'+Date.now(),warehouse:currentUser().warehouse,...f});save();toast('Agenda actualizada y publicada.');render()});
      const msg=$('#messageForm');if(msg)msg.addEventListener('submit',e=>{e.preventDefault();const text=new FormData(msg).get('text'),u=currentUser(),targets=usersForCity(u.city);targets.forEach(t=>notify(t.id,'Mensaje del Almacén de Evidencias',text));db.messages.unshift({id:'m'+Date.now(),adminId:u.id,city:u.city,text,date:nowISODate()});save();toast(`Mensaje publicado a ${targets.length} visitante(s).`);msg.reset()});
      const stats=$('#statsForm');if(stats)stats.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(stats));if(f.to<f.from){toast('La fecha final no puede ser anterior a la inicial.');return}state.statsFilter=f;render()});
      const printStats=$('#printStats');if(printStats)printStats.addEventListener('click',()=>printable('Estadísticas del Almacén',screen.querySelector('.stats').outerHTML+screen.querySelector('.bars').outerHTML));
      const shareStats=$('#shareStats');if(shareStats)shareStats.addEventListener('click',()=>shareText('Resumen estadístico del Sistema de Turnos del Almacén de Evidencias.'));
      const uf=$('#userFilterForm');if(uf)uf.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(uf));if(f.to<f.from){toast('La fecha final no puede ser anterior a la inicial.');return}state.userFilter=f;render()});
      const pua=$('#printUserAppointments');if(pua)pua.addEventListener('click',()=>printable('Citas agendadas por usuario',screen.querySelector('.table-wrap').outerHTML));
      const sua=$('#shareUserAppointments');if(sua)sua.addEventListener('click',()=>shareText('Consulta de citas agendadas por usuario.'));
    }
    function completeRegistration(role){const d=state.registerDraft;const u={id:(role==='admin'?'a':'v')+Date.now(),role,name:d.name,docType:d.docType,doc:d.doc,email:d.email,phone:d.phone,entity:d.entity,job:d.job,city:role==='admin'?(d.warehouse||'Bogotá'):d.city,warehouse:role==='admin'?d.warehouse:undefined,password:d.password,active:true,photo:'',policyVersion:'1.1',policyAcceptedAt:new Date().toISOString()};db.users.push(u);save();state.session=u.id;state.adminAttempts=0;state.registerDraft={};state.policyAccepted=false;state.policyViewed=false;state.screen='welcome';render();toast('Registro confirmado y usuario activo.')}
    render();setTimeout(()=>{if(state.screen==='splash')go('home')},1800);
  })();
  </script>
</div>
