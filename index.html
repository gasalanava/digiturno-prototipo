<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b33">
<meta name="description" content="Acceso al Sistema de Turnos para Almacenes, una herramienta de GIRÖN Digital Systems.">
<title>Sistema de Turnos | GIRÖN Digital Systems</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--ink:#111827;--line:#d0d5dd;--muted:#667085}
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.page{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(100%,420px);background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.12);padding:42px 32px;text-align:center}
.logo{width:150px;max-width:70%;height:auto;margin-bottom:26px}
h1{font-size:24px;font-weight:500;text-transform:uppercase;line-height:1.15;margin:0 0 14px}
p{font-size:12px;line-height:1.55;color:#475467}
.btn{display:inline-block;margin-top:18px;border:0;border-radius:5px;background:linear-gradient(#344054,#101828);color:#fff;text-decoration:none;padding:11px 22px;min-width:190px;cursor:pointer;font-weight:700}
.error{margin-top:18px;padding:10px;border:1px solid #b55;background:#fff5f5;color:#711;font-size:11px}
.tiny{font-size:9px;color:var(--muted);margin-top:26px}
@media(max-width:520px){.page{padding:0}.card{width:100%;min-height:100vh;border:0;box-shadow:none;display:flex;flex-direction:column;justify-content:center}}
</style>
</head>
<body>
<main class="page"><section class="card">
<img class="logo" src="assets/giron-logo-simple.png" alt="GIRÖN Digital Systems">
<h1>Sistema de Turnos para Almacenes</h1>
<p>Acceso seguro al sistema de registro, agendamiento y gestión de turnos.</p>
<a id="enter" class="btn" href="#">Ingresar</a>
<div id="error" class="error" hidden>No fue posible identificar la URL del sistema. Revise <strong>config.js</strong>.</div>
<p class="tiny">La base de datos, credenciales y reglas de autorización no se publican en este sitio.</p>
</section></main>
<script src="config.js"></script>
<script>
(function(){
  const url=String(window.DIGITURNO_WEB_APP_URL||'').trim();
  const valid=/^https:\/\/script\.google\.com\/.*\/exec(?:[?#].*)?$/i.test(url);
  const btn=document.getElementById('enter'), err=document.getElementById('error');
  if(!valid){btn.onclick=e=>{e.preventDefault();err.hidden=false};return}
  btn.href=url;
})();
</script>
</body>
</html>
